services:
  source-validator:
    image: solanalabs/solana:v1.18.26
    entrypoint: ["solana-test-validator"]
    command: ["--bind-address", "0.0.0.0", "--rpc-port", "8899", "--faucet-port", "9900", "--ledger", "/tmp/routerpulse-source", "--reset"]
    ports: ["8899:8899", "9900:9900"]
    healthcheck:
      test: ["CMD", "solana", "cluster-version", "--url", "http://127.0.0.1:8899"]
      interval: 5s
      timeout: 5s
      retries: 30
  destination-validator:
    image: solanalabs/solana:v1.18.26
    entrypoint: ["solana-test-validator"]
    command: ["--bind-address", "0.0.0.0", "--rpc-port", "8899", "--faucet-port", "9900", "--ledger", "/tmp/routerpulse-destination", "--reset"]
    ports: ["8900:8899", "9901:9900"]
    healthcheck:
      test: ["CMD", "solana", "cluster-version", "--url", "http://127.0.0.1:8899"]
      interval: 5s
      timeout: 5s
      retries: 30
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routerpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh to generate .env first}
      POSTGRES_DB: ${POSTGRES_DB:-routerpulse}
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      API_KEY: ${API_KEY:?Run scripts/setup.sh to generate .env first}
      DATABASE_URL: postgres://${POSTGRES_USER:-routerpulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routerpulse}
      SOURCE_RPC_URL: http://source-validator:8899
      DESTINATION_RPC_URL: http://destination-validator:8899
      RUST_LOG: info
    depends_on:
      db: {condition: service_healthy}
      source-validator: {condition: service_healthy}
      destination-validator: {condition: service_healthy}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 12
  web:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:8080"]
volumes:
  postgres_data:
  redis_data:

